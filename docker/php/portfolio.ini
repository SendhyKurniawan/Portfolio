; The base image ships no php.ini, so PHP's development-style defaults apply.

; Never show errors to visitors; log them to the container output instead
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Don't advertise the PHP version in X-Powered-By
expose_php = Off

; Matches UPLOAD_MAX_BYTES in lib/upload.php
upload_max_filesize = 5M
post_max_size = 8M

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
