# The project root is bind-mounted as the web root, so keep internals private.
# Every pattern is case-insensitive: Docker Desktop bind mounts from Windows/macOS
# resolve /Config/db.php to config/db.php, so case-sensitive rules can be bypassed.
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
</Directory>

# Dotfiles and dot-directories (.env, .git, .claude)
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# PHP includes, schema, tooling and tests are never served directly
<DirectoryMatch "(?i)^/var/www/html/(config|lib|database|docker|tests|vendor)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(?i)(\.(sql|md|ya?ml|json|lock|sh|xml|dist|ini|log|conf)|^dockerfile)$">
    Require all denied
</FilesMatch>

# Uploaded files are data, never code
<DirectoryMatch "(?i)^/var/www/html/uploads(/|$)">
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|pht)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# Missing pages get the blue screen instead of Apache's default
ErrorDocument 404 /404.php

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
