# The project root is bind-mounted as the web root, so keep internals private.
# Every pattern is case-insensitive: Docker Desktop bind mounts from Windows/macOS
# resolve /Config/db.php to config/db.php, so case-sensitive rules can be bypassed.
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
</Directory>

# Dotfiles and dot-directories (.env, .git, editor and tooling folders)
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# PHP includes, schema, tooling and tests are never served directly
<DirectoryMatch "(?i)^/var/www/html/(config|lib|database|docker|tests|vendor)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(?i)(\.(sql|md|ya?ml|json|lock|sh|xml|dist|ini|log|conf)|^dockerfile)$">
    Require all denied
</FilesMatch>

# Uploaded files are data, never code
<DirectoryMatch "(?i)^/var/www/html/uploads(/|$)">
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|pht)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# Missing pages get the blue screen instead of Apache's default
ErrorDocument 404 /404.php

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

# Behind the Cloudflare tunnel the origin hop is plain HTTP on loopback, so PHP
# would see no HTTPS and hand out session cookies without Secure while writing
# http:// into canonical and og:image. cloudflared forwards the visitor's real
# scheme in X-Forwarded-Proto; trust it, because nothing reaches this container
# except the tunnel and the published loopback port.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# mod_dir menyusun redirect trailing-slash-nya dari skema milik origin, yang di
# belakang tunnel selalu HTTP polos — "/admin" jadi memantul lewat satu hop tanpa
# enkripsi dan hanya diselamatkan aturan Always Use HTTPS di Cloudflare. Kerjakan
# redirect-nya di sini, memakai skema asli pengunjung.
#
# Harus di dalam <Directory>, bukan di server config: direktif mod_rewrite tidak
# diwarisi ke dalam <VirtualHost>, dan permintaan dilayani vhost default — aturan
# di level server akan diabaikan diam-diam.
<Directory /var/www/html>
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =https
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteCond %{REQUEST_URI} !/$
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI}/ [R=301,L]
</Directory>
